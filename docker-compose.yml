services:
  keystone-init:
    build: .
    image: keystone:local
    restart: "no"
    user: "0:0"
    command: ["node", "scripts/init-data.mjs"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - authi-data:/app/data

  keystone:
    build: .
    image: keystone:local
    restart: unless-stopped
    environment:
      # All optional. Normally set the public URL, cookie domain, trusted proxies and log level in
      # Keystone's Settings page (/admin/settings); a value set here overrides it and is shown locked.
      KEYSTONE_ISSUER_URL: ${KEYSTONE_ISSUER_URL:-}
      KEYSTONE_COOKIE_DOMAIN: ${KEYSTONE_COOKIE_DOMAIN:-}
      KEYSTONE_TRUST_PROXY: ${KEYSTONE_TRUST_PROXY:-}
      PORT: 9000
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Empty values are treated as unset. Without KEYSTONE_SECRET_KEY, the key is generated
      # once into the authi-data volume (secret.key).
      KEYSTONE_SECRET_KEY: ${KEYSTONE_SECRET_KEY:-}
      # First admin, created only while the database has no users.
      KEYSTONE_BOOTSTRAP_ADMIN_USER: ${KEYSTONE_BOOTSTRAP_ADMIN_USER:-}
      KEYSTONE_BOOTSTRAP_ADMIN_PASSWORD: ${KEYSTONE_BOOTSTRAP_ADMIN_PASSWORD:-}
      KEYSTONE_BOOTSTRAP_ADMIN_EMAIL: ${KEYSTONE_BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      # Reachable on all interfaces by default (http://<host-ip>:9000). Once a reverse proxy runs on this host,
      # start with KEYSTONE_BIND_ADDRESS=127.0.0.1 so only the proxy can reach Keystone.
      # If you change the address or KEYSTONE_HOST_PORT, set the public URL in Settings (/admin/settings).
      - "${KEYSTONE_BIND_ADDRESS:-0.0.0.0}:${KEYSTONE_HOST_PORT:-9000}:9000"
    depends_on:
      keystone-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - authi-data:/app/data
    networks:
      - keystone-internal
    # Behind Traefik, add labels like these. Traefik must either join the keystone-internal
    # network (so http://keystone:9000 resolves) or target the loopback port
    # http://127.0.0.1:${KEYSTONE_HOST_PORT:-9000} when it runs on the host.
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.keystone.rule=Host(`auth.example.com`)
    #   - traefik.http.services.keystone.loadbalancer.server.port=9000
    #   - traefik.http.middlewares.keystone.forwardauth.address=http://keystone:9000/outpost/auth
    #   - traefik.http.middlewares.keystone.forwardauth.trustForwardHeader=false
    #   - traefik.http.middlewares.keystone.forwardauth.authResponseHeaders=X-Keystone-User,X-Keystone-Email,X-Keystone-Name,X-Keystone-Groups,X-Keystone-Uid

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD_FILE: /run/authi-data/postgres-password
      POSTGRES_DB: keystone
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - authi-data:/run/authi-data:ro
    depends_on:
      keystone-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - keystone-internal

networks:
  keystone-internal:
    driver: bridge

volumes:
  authi-data:
  postgres-data: