services:
  authi-init:
    build: .
    image: authi:local
    restart: "no"
    user: "0:0"
    command: ["node", "scripts/init-data.mjs"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - authi-data:/app/data

  authi:
    build: .
    image: authi:local
    restart: unless-stopped
    environment:
      AUTHI_ISSUER_URL: ${AUTHI_ISSUER_URL:-http://localhost:9000}
      AUTHI_COOKIE_DOMAIN: ${AUTHI_COOKIE_DOMAIN:-}
      AUTHI_TRUST_PROXY: ${AUTHI_TRUST_PROXY:-loopback,linklocal,uniquelocal}
      PORT: 9000
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${AUTHI_HOST_PORT:-9000}:9000"
    depends_on:
      authi-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - authi-data:/app/data
    networks:
      - authi-internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authi
      POSTGRES_PASSWORD_FILE: /run/authi-data/postgres-password
      POSTGRES_DB: authi
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - authi-data:/run/authi-data:ro
    depends_on:
      authi-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authi -d authi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - authi-internal

networks:
  authi-internal:
    driver: bridge

volumes:
  authi-data:
  postgres-data: