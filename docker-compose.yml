services:
  keystone-init:
    build: .
    image: keystone:local
    restart: "no"
    user: "0:0"
    command: ["node", "scripts/init-data.mjs"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - authi-data:/app/data

  keystone:
    build: .
    image: keystone:local
    restart: unless-stopped
    environment:
      KEYSTONE_ISSUER_URL: ${KEYSTONE_ISSUER_URL:-http://localhost:9000}
      KEYSTONE_COOKIE_DOMAIN: ${KEYSTONE_COOKIE_DOMAIN:-}
      KEYSTONE_TRUST_PROXY: ${KEYSTONE_TRUST_PROXY:-loopback,linklocal,uniquelocal}
      PORT: 9000
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${KEYSTONE_HOST_PORT:-9000}:9000"
    depends_on:
      keystone-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - authi-data:/app/data
    networks:
      - keystone-internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD_FILE: /run/authi-data/postgres-password
      POSTGRES_DB: keystone
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - authi-data:/run/authi-data:ro
    depends_on:
      keystone-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - keystone-internal

networks:
  keystone-internal:
    driver: bridge

volumes:
  authi-data:
  postgres-data: