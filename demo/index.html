<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keystone Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="mock.js" defer></script>
  </head>
  <body>
    <div class="preview-ribbon" role="note"><span class="status-dot"></span>Preview · sample data only</div>

    <main class="signin" id="loginScreen">
      <section class="signin-card" aria-labelledby="loginTitle">
        <div class="signin-brand">
          <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-3.6 16H6.6z"/></svg>
          <span class="logo-word">Keystone</span>
        </div>
        <div class="signin-body">
          <h1 id="loginTitle">Sign in</h1>
          <form id="loginForm" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="name@harbor.test" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="reveal-button" id="togglePassword" type="button" aria-label="Show password">Show</button>
              </div>
            </div>
            <label class="check" for="remember"><input id="remember" name="remember" type="checkbox"> Keep me signed in</label>
            <p class="form-error" id="loginError" role="alert" hidden></p>
            <button class="button button-primary button-block" type="submit">Sign in</button>
          </form>
          <button class="link-button" id="helpLink" type="button">Need help signing in?</button>
        </div>
        <div class="sample-accounts">
          <p class="sample-head"><span>Sample accounts</span><span>Password <code>keystone-demo</code></span></p>
          <button class="account-choice" type="button" data-email="jordan@harbor.test">
            <span class="avatar tone-blue">JM</span>
            <span class="account-meta"><strong>Jordan Morgan</strong><small>Administrator</small></span>
            <span class="choice-arrow" aria-hidden="true">&rarr;</span>
          </button>
          <button class="account-choice" type="button" data-email="alex@harbor.test">
            <span class="avatar tone-green">AL</span>
            <span class="account-meta"><strong>Alex Lee</strong><small>Member</small></span>
            <span class="choice-arrow" aria-hidden="true">&rarr;</span>
          </button>
        </div>
      </section>
      <p class="signin-foot"><span>Secured by Keystone</span><span aria-hidden="true">·</span><span>Nothing you enter leaves this browser</span></p>
    </main>

    <div class="app-shell" id="appShell" hidden>
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="brand" type="button" data-page="home">
          <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18l-3.6 16H6.6z"/></svg>
          <span>Keystone</span>
        </button>
        <span class="org-name">Harbor House</span>
        <label class="top-search" for="appSearch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="appSearch" type="search" placeholder="Search your apps" aria-label="Search your apps">
        </label>
        <div class="topbar-right">
          <span class="preview-chip">Preview</span>
          <button class="profile-button" id="profileButton" type="button" aria-label="Sign out">
            <span class="avatar tone-blue" id="profileAvatar">JM</span>
            <span class="profile-meta"><strong id="profileName">Jordan Morgan</strong><small id="profileRole">Administrator</small></span>
            <span class="profile-action">Sign out</span>
          </button>
        </div>
      </header>

      <div class="shell-body">
        <aside class="sidebar" id="sidebar">
          <nav class="side-nav" aria-label="Main navigation">
            <button class="nav-link is-active" type="button" data-page="home">
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
              My apps
            </button>
            <div class="admin-nav" id="adminNav" hidden>
              <p class="nav-caption">Admin</p>
              <button class="nav-link" type="button" data-page="applications">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H6a3 3 0 0 0 0 6h3M15 7h3a3 3 0 0 1 0 6h-3M8 10h8"/><path d="M12 17v4"/></svg>
                Applications <span class="nav-count" id="appCount">6</span>
              </button>
              <button class="nav-link" type="button" data-page="users">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg>
                People <span class="nav-count" id="peopleCount">8</span>
              </button>
            </div>
          </nav>
          <p class="sidebar-note">Changes reset when you reload.</p>
        </aside>
        <main class="main-area" id="pageContent" aria-live="polite"></main>
      </div>

      <div class="nav-scrim" id="navScrim" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      <div class="modal-backdrop" id="modalBackdrop" hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <button class="modal-close" id="modalClose" type="button" aria-label="Close dialog">&times;</button>
          <div id="modalContent"></div>
        </section>
      </div>
    </div>
  </body>
</html>
